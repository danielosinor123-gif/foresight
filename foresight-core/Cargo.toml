[package]
name = "foresight-core"
version = "0.1.0"
edition = "2021"
description = "Foresight native core: telemetry sampler, anomaly engine and the policy verifier (memory-safe core of the Foresight system layer)"

[dependencies]
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
